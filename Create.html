<!DOCTYPE html>
<html>

<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="create-page">

        <section class="card">

            <h1>StockWise POS</h1>

            <form
                class="create-form"
                id="create-account-form"
            >

                <h3>Create Account</h3>

                <div class="form-row">

                    <label for="first-name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        required
                    >

                </div>

                <div class="form-row">

                    <label for="last-name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        required
                    >

                </div>

                <div class="form-row">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>

                <div class="form-row">

                    <label for="create-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="create-username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-row">

                    <label for="create-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="create-password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <p
                    id="create-account-message"
                    class="form-message"
                    hidden
                ></p>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="create-account-button"
                    >
                        Create Account
                    </button>

                    <a
                        href="LogIn.html"
                        class="back-button"
                    >
                        Back
                    </a>

                </div>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
