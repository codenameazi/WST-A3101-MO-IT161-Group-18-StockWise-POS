<!DOCTYPE html>
<html>

<head>
    <title>Inventory Add</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <h2>StockWise POS</h2>
        <div class="user">USER</div>
    </header>

    <aside class="sidebar">

        <nav>
            <a href="Dashboard.html">HOME</a>
            <a href="Order.html">ORDERS</a>
            <a href="Inventory.html" class="active">INVENTORY</a>
            <a href="Reports.html">REPORTS</a>
            <a href="Rewards.html">REWARD</a>

            <div class="sidebar-bottom">
                <a href="Notifications.html">NOTIFICATIONS</a>
                <a href="Settings.html">SETTINGS</a>

                <footer>
                    <a href="LogIn.html">LOGOUT</a>
                </footer>
            </div>
        </nav>

    </aside>

    <main class="form-page">

        <h2>Add Product</h2>

        <form id="inventory-add-form">

            <div class="form-row">

                <label for="category">
                    Category:
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="Enter product category"
                    required
                >

            </div>

            <div class="form-row">

                <label for="item-name">
                    Item Name:
                </label>

                <input
                    type="text"
                    id="item-name"
                    name="item-name"
                    placeholder="Enter product name"
                    required
                >

            </div>

            <div class="form-row">

                <label for="expiration-date">
                    Expiration Date:
                </label>

                <input
                    type="date"
                    id="expiration-date"
                    name="expiration-date"
                    required
                >

            </div>

            <div class="form-row">

                <label for="quantity">
                    Quantity:
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >

            </div>

            <p
                id="inventory-form-message"
                class="form-message"
                hidden
            ></p>

            <div class="form-actions">

                <button
                    type="button"
                    id="scan"
                >
                    Scan
                </button>

                <button
                    type="submit"
                    id="add"
                >
                    Add
                </button>

                <a
                    href="Inventory.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
