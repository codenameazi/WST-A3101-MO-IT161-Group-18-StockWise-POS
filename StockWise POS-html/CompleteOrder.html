<!DOCTYPE html>
<html>

<head>
    <title>Complete Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <h2>StockWise POS</h2>
        <div class="user">USER</div>
    </header>

    <aside class="sidebar">

        <nav>
            <a href="Dashboard.html">HOME</a>
            <a href="Order.html" class="active">ORDERS</a>
            <a href="Inventory.html">INVENTORY</a>
            <a href="Reports.html">REPORTS</a>
            <a href="Rewards.html">REWARD</a>

            <div class="sidebar-bottom">
                <a href="Notifications.html">NOTIFICATIONS</a>
                <a href="Settings.html">SETTINGS</a>

                <footer>
                    <a href="LogIn.html">LOGOUT</a>
                </footer>
            </div>
        </nav>

    </aside>

    <main class="complete-order-page">

        <section class="card">

            <h3>Order List</h3>

            <div class="order-items" id="co-order-items"></div>

            <p>
                <strong>Total</strong>
                <span id="co-order-total">₱0.00</span>
            </p>

        </section>

        <section class="card">

            <h3>Payment Method</h3>

            <button type="button" class="payment-button" data-method="Cash">Cash</button>
            <button type="button" class="payment-button" data-method="Split Payment">Split Payment</button>
            <button type="button" class="payment-button" data-method="E-Wallet">E-Wallet</button>

        </section>

        <section class="card">

            <button type="button" id="print-receipt">
                Print
            </button>

        </section>

        <section class="card">

            <div class="page-actions">

                <a href="Order.html" class="back-button">
                    Back
                </a>

                <button type="button" class="remove-button" id="cancel-order">
                    Cancel
                </button>

                <a href="Order.html" class="new-order-button" id="new-order">
                    New Order
                </a>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
