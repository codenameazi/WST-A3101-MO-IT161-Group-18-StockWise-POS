<!DOCTYPE html>
<html>

<head>
    <title>Order</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <h2>StockWise POS</h2>
        <div class="user">USER</div>
    </header>

    <aside class="sidebar">

        <nav>
            <a href="Dashboard.html">HOME</a>
            <a href="Order.html" class="active">ORDERS</a>
            <a href="Inventory.html">INVENTORY</a>
            <a href="Reports.html">REPORTS</a>
            <a href="Rewards.html">REWARD</a>

            <div class="sidebar-bottom">
                <a href="Notifications.html">NOTIFICATIONS</a>
                <a href="Settings.html">SETTINGS</a>

                <footer>
                    <a href="LogIn.html">LOGOUT</a>
                </footer>
            </div>
        </nav>

    </aside>

    <main class="order-page">

        <section class="order-content">

            <div class="search-area">

                <form onsubmit="return false;">

                    <input
                        type="search"
                        id="search"
                        name="search"
                        placeholder="Search product"
                    >

                    <button type="button">
                        Scan Item / Barcode
                    </button>

                </form>

            </div>

            <h3 class="category-title">Products</h3>

            <div class="product-grid">

                <button
                    type="button"
                    class="product-button"
                    data-name="Rice"
                    data-price="60"
                >
                    Rice<br>
                    ₱60.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Cooking Oil"
                    data-price="95"
                >
                    Cooking Oil<br>
                    ₱95.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Sugar"
                    data-price="75"
                >
                    Sugar<br>
                    ₱75.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Egg"
                    data-price="10"
                >
                    Egg<br>
                    ₱10.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Monggo"
                    data-price="85"
                >
                    Monggo<br>
                    ₱85.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Bihon"
                    data-price="45"
                >
                    Bihon<br>
                    ₱45.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Margarine"
                    data-price="55"
                >
                    Margarine<br>
                    ₱55.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Peanuts"
                    data-price="40"
                >
                    Peanuts<br>
                    ₱40.00
                </button>

                <button
                    type="button"
                    class="product-button"
                    data-name="Flour"
                    data-price="65"
                >
                    Flour<br>
                    ₱65.00
                </button>

            </div>

        </section>

        <section class="order-list">

            <h3>Customer Order List</h3>

            <p id="empty-order">
                No items added yet.
            </p>

            <div
                class="order-items"
                id="order-items"
            ></div>

            <div class="order-total">

                <strong>Total</strong>

                <strong id="order-total">
                    ₱0.00
                </strong>

            </div>

            <div class="order-actions">

                <a
                    href="CompleteOrder.html"
                    class="complete-button"
                    id="complete-order"
                >
                    Complete
                </a>

                <button
                    type="button"
                    class="remove-button"
                    id="remove-item"
                >
                    Remove
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
