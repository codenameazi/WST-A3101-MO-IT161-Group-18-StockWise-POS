<!DOCTYPE html>
<html>

<head>
    <title>Rewards Add Customer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <h2>StockWise POS</h2>
        <div class="user">USER</div>
    </header>

    <aside class="sidebar">

        <nav>
            <a href="Dashboard.html">HOME</a>
            <a href="Order.html">ORDERS</a>
            <a href="Inventory.html">INVENTORY</a>
            <a href="Reports.html">REPORTS</a>
            <a href="Rewards.html" class="active">REWARD</a>

            <div class="sidebar-bottom">
                <a href="Notifications.html">NOTIFICATIONS</a>
                <a href="Settings.html">SETTINGS</a>

                <footer>
                    <a href="LogIn.html">LOGOUT</a>
                </footer>
            </div>
        </nav>

    </aside>

    <main class="form-page">

        <h2>Customer Details</h2>

        <form id="reward-add-form">

            <div class="form-row">

                <label for="reward-name">
                    Customer Name
                </label>

                <input
                    type="text"
                    id="reward-name"
                    name="name"
                    placeholder="Enter customer name"
                    required
                >

            </div>

            <div class="form-row">

                <label for="reward-phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="reward-phone"
                    name="phonenumber"
                    placeholder="Enter phone number"
                    required
                >

            </div>

            <div class="form-row">

                <label for="reward-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="reward-email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >

            </div>

            <p
                id="reward-add-message"
                class="form-message"
                hidden
            ></p>

            <div class="form-actions">

                <button type="submit" id="add">
                    Add
                </button>

                <a
                    href="Rewards.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
