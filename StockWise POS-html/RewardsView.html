<!DOCTYPE html>
<html>

<head>
    <title>Rewards View</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-header">
        <h2>StockWise POS</h2>
        <div class="user">USER</div>
    </header>

    <aside class="sidebar">

        <nav>
            <a href="Dashboard.html">HOME</a>
            <a href="Order.html">ORDERS</a>
            <a href="Inventory.html">INVENTORY</a>
            <a href="Reports.html">REPORTS</a>
            <a href="Rewards.html" class="active">REWARD</a>

            <div class="sidebar-bottom">

                <a href="Notifications.html">
                    NOTIFICATIONS
                </a>

                <a href="Settings.html">
                    SETTINGS
                </a>

                <footer>
                    <a href="LogIn.html">
                        LOGOUT
                    </a>
                </footer>

            </div>
        </nav>

    </aside>


    <main class="rewards-view-page">

        <h2>Customer Details</h2>


        <section class="customer-summary">

            <div class="card">

                <h4>Total Orders</h4>

                <p id="customer-total-orders">
                    25
                </p>

            </div>


            <div class="card">

                <h4>Credit</h4>

                <p id="customer-credit">
                    ₱25.00
                </p>

                <button
                    type="button"
                    id="pay-credit-button"
                >
                    Pay
                </button>

            </div>


            <div class="card">

                <h4>Reward Points</h4>

                <p id="customer-points">
                    250
                </p>

                <button
                    type="button"
                    id="redeem-points-button"
                >
                    Redeem
                </button>

            </div>

        </section>


        <p
            id="rewards-view-message"
            class="form-message"
            hidden
        ></p>


        <section class="customer-information card">

            <h3>Customer Information</h3>

            <p>
                <strong>Customer Name:</strong>
                <span id="customer-name">
                    Keon
                </span>
            </p>

            <p>
                <strong>Phone Number:</strong>
                <span id="customer-phone">
                    0000-0000-0000
                </span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="customer-email">
                    keon@sample.com
                </span>
            </p>

            <p>
                <strong>Customer Since:</strong>
                <span id="customer-since">
                    01/01/01
                </span>
            </p>

        </section>


        <div class="page-actions">

            <a
                href="RewardEdit.html"
                class="edit-button"
            >
                Edit
            </a>

            <a
                href="Rewards.html"
                class="back-button"
            >
                Back
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
