<!DOCTYPE html>
<html>

<head>
    <title>Log In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <h1>StockWise POS</h1>

            <form
                class="login-form"
                id="login-form"
            >

                <div class="form-row">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                    <label for="username">
                        Username
                    </label>

                </div>

                <div class="form-row">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                    <label for="password">
                        Password
                    </label>

                </div>

                <p
                    id="login-message"
                    class="form-message"
                    hidden
                ></p>

                <div class="form-actions">

                    <button
                        type="submit"
                        id="login-button"
                    >
                        Login
                    </button>

                    <a
                        href="Create.html"
                        class="create-button"
                    >
                        Create
                    </a>

                </div>

            </form>

        </section>

        <footer class="login-footer">
            <p>--HHAK-StockWise--</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
